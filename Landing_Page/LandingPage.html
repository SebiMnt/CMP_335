<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SebsShoes</title>
    <link rel="stylesheet" href="LandingPage.css">
</head>

<body>
    <div class="top-bar">

        <div class="store-name">SebsShoes</div>

        <div class="logo">
            <img src="logo.jpg" alt="SebsShoes Logo">
        </div>

        <div class="basket">
            <a href="https://stockx.com">
                🛒
            </a>
        </div>

    </div>

    <div class="orange-bar"></div>
    <div class="myflexboxRow">

        <div class="myflexboxColumn">
            <h2>Get fire shoes!</h2>

            <a href="https://stockx.com">
                <button type="button">Shop Now</button>
            </a>
        </div>


        <div class="myflexboxColumn">
            <h2>New Release!</h2>
            <img src="shoe1.jpg" alt="New basketball shoe">
            <p>$129.99</p>
        </div>


        <div class="myflexboxColumn">
            <h2>Recently Popular!</h2>
            <img src="shoe2.jpg" alt="Popular basketball shoe">
            <p>$209.99</p>
        </div>


        <div class="myflexboxColumn">
            <h2>Discount!</h2>
            <img src="shoe3.jpg" alt="Discount basketball shoe">
            <p>$79.99</p>
        </div>
    </div>

    <div class="orange-bar"></div>

    <div class="locations">
        <h2>Locations</h2>

        <table>
            <tr>
                <th>City</th>
                <th>State</th>
                <th>Address</th>
            </tr>

            <tr>
                <td>Crete</td>
                <td>Nebraska</td>
                <td>1014 Boswell Ave</td>
            </tr>

            <tr>
                <td>Lincoln</td>
                <td>Nebraska</td>
                <td>1141 Bond St.</td>
            </tr>

            <tr>
                <td>Des Moines</td>
                <td>Iowa</td>
                <td>2017 Maro St.</td>
            </tr>
        </table>
    </div>
</body>
</html>
