<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 3 Exercise - Javascript Sampling</title>

    <link rel="stylesheet" href="CentralTendencyCalc.css">
    <script src="CentralTendencyCalc.js"></script>
</head>
<body>
    <h1>Central Tendency Calculator</h1>
    <div class="myflexboxRow">
        <div class="myflexboxColumn">
            <h3>Set Range</h3>
            <form name="myForm">
                Low Number: <input type="number" name="newLow" value=""><br />
                High Number: <input type="number" name="newHigh" value=""><br /><br />
                <h3>Add Number</h3>
                Add Number: <input type="number" name="newNum" value=""><br /><br />
                <input type="button" value="Add to list" onclick="add()">
            </form>
        </div>
        <div class="myflexboxColumn">
            <h3>List</h3>
            <table id="myList1">
            </table>
            <br /> <br />
            <input type="button" value="Clear the list" onclick="clearList1()">
        </div>
        <div class="myflexboxColumn">
            <h3>Result</h3>
            <p>Mean: <span id="meanResult"></span></p>
            <p>Median: <span id="medianResult"></span></p>
            <p>Mode: <span id="modeResult"></span></p>
        </div>
    </div>    
</body>
</html>
